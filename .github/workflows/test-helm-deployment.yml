name: Test Helm Chart Deployment

on:
  pull_request:
    paths:
      - 'helm/**'
      - 'web/Dockerfile*'
      - 'poller/Dockerfile*'
      - 'common/**'
      - 'web/patches/**'
      - '.github/workflows/test-helm-deployment.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      web_changed: ${{ steps.changes.outputs.web }}
      poller_changed: ${{ steps.changes.outputs.poller }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            web:
              - 'web/**'
              - 'common/**'
            poller:
              - 'poller/**'
              - 'common/**'

  build-web-image:
    needs: detect-changes
    if: needs.detect-changes.outputs.web_changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/centreon-web-alma9
          tags: |
            type=ref,event=pr,suffix=-test
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile.alma9.openshift
          platforms: linux/amd64
          build-args: |
            REGISTRY_URL=docker.io/slydien
            FROM_IMAGE_VERSION=24.10
            STABILITY=stable
          tags: ${{ steps.meta.outputs.tags }}
          push: true

  build-poller-image:
    needs: detect-changes
    if: needs.detect-changes.outputs.poller_changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/centreon-poller-alma9
          tags: |
            type=ref,event=pr,suffix=-test
      - name: Build and push poller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: poller/Dockerfile.alma9.openshift
          platforms: linux/amd64
          build-args: |
            REGISTRY_URL=ghcr.io/slydien
            FROM_IMAGE_VERSION=24.10
            STABILITY=stable
          tags: ${{ steps.meta.outputs.tags }}
          push: true

  test-deployment:
    needs: [detect-changes, build-web-image, build-poller-image]
    # Always run, even if build jobs were skipped
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup CRC (MicroShift)
        uses: crc-org/crc-github-action@v1
        with:
          preset: microshift

      - name: Set image references
        run: |
          # Use PR-built images if available, otherwise fall back to public images
          if [ "${{ needs.build-web-image.outputs.image }}" != "" ]; then
            WEB_IMAGE="${{ needs.build-web-image.outputs.image }}"
          else
            WEB_IMAGE="ghcr.io/slydien/centreon-web-alma9:24.10-openshift"
          fi

          if [ "${{ needs.build-poller-image.outputs.image }}" != "" ]; then
            POLLER_IMAGE="${{ needs.build-poller-image.outputs.image }}"
          else
            POLLER_IMAGE="ghcr.io/slydien/centreon-poller-alma9:24.10-openshift"
          fi

          echo "WEB_IMAGE=$WEB_IMAGE" >> $GITHUB_ENV
          echo "POLLER_IMAGE=$POLLER_IMAGE" >> $GITHUB_ENV
          echo "Using web image: $WEB_IMAGE"
          echo "Using poller image: $POLLER_IMAGE"

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Create namespace
        run: kubectl create namespace centreon

      - name: Install Helm chart
        run: |
          helm install centreon ./helm/centreon-openshift \
            --namespace centreon \
            --set services.web.image="${WEB_IMAGE}" \
            --set services.poller.image="${POLLER_IMAGE}" \
            --timeout 15m

      - name: Wait for pods to be ready
        run: |
          echo "Waiting for all pods to be ready..."
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/instance=centreon \
            -n centreon \
            --timeout=600s

          echo "All pods are ready!"
          kubectl get pods -n centreon

      - name: Verify services
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n centreon -o wide

          echo "=== Services ==="
          kubectl get svc -n centreon

          echo "=== Routes ==="
          kubectl get routes -n centreon 2>/dev/null || echo "Routes not available in MicroShift"

      - name: Debug info on failure
        if: failure()
        run: |
          echo "=== All Resources ==="
          kubectl get all -n centreon

          echo "=== Pod Descriptions ==="
          kubectl describe pods -n centreon

          echo "=== Pod Logs ==="
          for pod in $(kubectl get pods -n centreon -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- Logs for $pod ---"
            kubectl logs $pod -n centreon --all-containers --tail=100 || true
          done

          echo "=== Events ==="
          kubectl get events -n centreon --sort-by='.lastTimestamp'
