name: build-poller-image

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alma9
            dockerfile: poller/Dockerfile.alma9.openshift
            tag: ghcr.io/slydien/centreon-poller-alma9:24.10-openshift
            from_image_version: "24.10"
          - name: alma9
            dockerfile: poller/Dockerfile.alma9.openshift
            tag: ghcr.io/slydien/centreon-poller-alma9:25.10-openshift
            from_image_version: "25.10"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ matrix.tag }}
          build-args: |
            REGISTRY_URL=ghcr.io/slydien
            FROM_IMAGE_VERSION=${{ matrix.from_image_version }}
            STABILITY=stable
