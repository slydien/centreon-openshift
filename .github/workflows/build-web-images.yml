name: Build web images

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alma9
            dockerfile: web/Dockerfile.alma9.openshift
            tag: slydien/centreon-web-alma9:24.10-openshift
          - name: alma8
            dockerfile: web/Dockerfile.alma8.openshift
            tag: slydien/centreon-web-alma8:24.10-openshift
          - name: bookworm
            dockerfile: web/Dockerfile.bookworm.openshift
            tag: slydien/centreon-web-bookworm:24.10-openshift
          - name: jammy
            dockerfile: web/Dockerfile.jammy.openshift
            tag: slydien/centreon-web-jammy:24.10-openshift

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ matrix.tag }}
          build-args: |
            REGISTRY_URL=docker.io/slydien
            FROM_IMAGE_VERSION=24.10
            STABILITY=stable
