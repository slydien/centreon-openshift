{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "centreon.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "centreon.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "centreon.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      {{- $podSec := $svc.podSecurityContext | default $.Values.global.podSecurityContext }}
      {{- if $podSec }}
      securityContext:
        {{- toYaml $podSec | nindent 8 }}
      {{- end }}
      {{- if $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if and (eq $name "poller") $svc.initWait $svc.initWait.enabled }}
      {{- $defaultWebUrl := printf "http://web.%s.svc.cluster.local/centreon/api/latest/platform/versions" $.Release.Namespace }}
      {{- $webUrl := $svc.initWait.webUrl | default $defaultWebUrl }}
      {{- $dbHost := $svc.initWait.dbHost | default "db" }}
      {{- $dbPort := $svc.initWait.dbPort | default 3306 }}
      initContainers:
        - name: wait-deps
          image: {{ $svc.initWait.image | default "alpine:3.19" | quote }}
          imagePullPolicy: {{ $svc.imagePullPolicy | default $.Values.global.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - >
              set -e;
              timeout={{ $svc.initWait.timeoutSeconds | default 300 }};
              start=$(date +%s);
              while true; do
                now=$(date +%s);
                if [ $((now - start)) -ge "$timeout" ]; then
                  echo "Timed out waiting for dependencies";
                  exit 1;
                fi;
                if wget -qO- {{ $webUrl | quote }} >/dev/null 2>&1 && nc -z -w 3 {{ $dbHost | quote }} {{ $dbPort }} >/dev/null 2>&1; then
                  echo "Web API and DB ready";
                  exit 0;
                fi;
                sleep 5;
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $svc.image | quote }}
          imagePullPolicy: {{ $svc.imagePullPolicy | default $.Values.global.imagePullPolicy }}
          {{- $ctrSec := $svc.securityContext | default $.Values.global.securityContext }}
          {{- if $ctrSec }}
          securityContext:
            {{- toYaml $ctrSec | nindent 12 }}
          {{- end }}
          {{- if $svc.resources }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- end }}
          {{- if $svc.ports }}
          ports:
            {{- $seen := dict }}
            {{- range $port := $svc.ports }}
            {{- $key := printf "%v/%v" $port.targetPort (default "TCP" $port.protocol) }}
            {{- if not (hasKey $seen $key) }}
            - name: {{ $port.name }}
              containerPort: {{ $port.targetPort }}
              {{- if $port.protocol }}
              protocol: {{ $port.protocol }}
              {{- end }}
            {{- $_ := set $seen $key true }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- if $svc.env }}
          env:
            {{- if eq $name "poller" }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOSTNAME
              value: "$(POD_IP)"
            {{- end }}
            {{- range $key, $val := $svc.env }}
            - name: {{ $key }}
              {{- if and (eq $key "WEB_HOST") (eq $val "") }}
              value: "web.{{ $.Release.Namespace }}.svc.cluster.local"
              {{- else }}
              value: {{ $val | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if $svc.envFrom }}
          envFrom:
            {{- toYaml $svc.envFrom | nindent 12 }}
          {{- end }}
          {{- if $svc.configMapMounts }}
          volumeMounts:
            {{- range $mount := $svc.configMapMounts }}
            - name: {{ $mount.name }}
              mountPath: {{ $mount.mountPath }}
              {{- if $mount.subPath }}
              subPath: {{ $mount.subPath }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if $svc.probes }}
          {{- if $svc.probes.startup }}
          startupProbe:
            {{- toYaml $svc.probes.startup | nindent 12 }}
          {{- end }}
          {{- if $svc.probes.readiness }}
          readinessProbe:
            {{- toYaml $svc.probes.readiness | nindent 12 }}
          {{- end }}
          {{- if $svc.probes.liveness }}
          livenessProbe:
            {{- toYaml $svc.probes.liveness | nindent 12 }}
          {{- end }}
          {{- end }}
      {{- if $svc.configMapMounts }}
      volumes:
        {{- range $mount := $svc.configMapMounts }}
        - name: {{ $mount.name }}
          configMap:
            name: {{ $mount.configMapName }}
        {{- end }}
      {{- end }}
---
{{- end }}
{{- end }}
