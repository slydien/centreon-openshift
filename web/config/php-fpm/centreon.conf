[centreon]
; OpenShift: container runs with arbitrary UID.
; Do not rely on named system users/groups.
;user = apache
;group = apache

; Use a unix socket inside the container filesystem.
listen = /run/php-fpm/centreon.sock
listen.mode = 0660

; If httpd runs as the same UID in the same container, it can connect fine.
; If you want to be extra-safe with OpenShift group 0 pattern:
;listen.group = 0

pm = ondemand
pm.max_children = 30
pm.process_idle_timeout = 10s
pm.max_requests = 500
rlimit_files = 4096

php_admin_value[error_log] = /var/log/php-fpm/centreon-error.log
php_admin_flag[log_errors] = on

php_value[session.save_handler] = files
php_value[session.save_path]    = /var/lib/php/session
php_value[soap.wsdl_cache_dir]  = /var/lib/php/wsdlcache

