# OpenShift: keep runtime artifacts out of /etc (read-only) and use writable tmpfs.
DefaultRuntimeDir "/run/httpd"

# Avoid FQDN warning (optional)
ServerName localhost

# Run-time files in writable dirs
PidFile "/run/httpd/httpd.pid"

# log to container files
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined

# Scoreboard/lock files (avoid writing under /etc/httpd/logs)
ScoreBoardFile /run/httpd/apache_runtime_status
Mutex default:/run/httpd


